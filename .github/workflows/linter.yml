# workflow name

name: pyliner

on: 
  push:
    paths: "*.py"

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: install ruff
        run: pip install ruff

      - name: fix lint issue
        run: ruff check .  --fix
        
      - name: Run code linter
        run: ruff check .
        
